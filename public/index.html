<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>いずれてっぺん超えれる？</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0%,#453025,#14141e 60%);color:#fff2d5;font-family:system-ui,'Noto Sans JP',sans-serif;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:22px 15px 70px}h1{text-align:center;font-size:clamp(25px,6vw,43px);margin:15px 0 5px;color:#ffd38a;text-shadow:0 3px #7e2f26}.subtitle{text-align:center;color:#d7a96d;margin:0 0 25px}.card{background:#211e29e8;border:1px solid #8b6244;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 8px 22px #0005}h2{font-size:20px;margin:0 0 15px}input,select,textarea{background:#17151d;color:#fff;border:1px solid #9d7654;border-radius:10px;padding:12px;width:100%;font-size:16px;margin:5px 0 12px}button{background:#c36c39;color:white;border:0;border-radius:10px;padding:12px 17px;font-size:15px;font-weight:bold;cursor:pointer;margin:4px}button.secondary{background:#534a58}button:disabled{opacity:.4;cursor:not-allowed}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}.tag{padding:4px 9px;border-radius:30px;background:#49342a;color:#ffe0a6;font-size:12px}.muted{color:#c9b7a8;font-size:14px}.hide{display:none!important}.player{border-bottom:1px solid #4c3d38;padding:9px 0}.big{font-size:29px;text-align:center;font-weight:bold;color:#ffd08b}.message{background:#382e2b;padding:13px;border-radius:12px;white-space:pre-wrap}.warn{color:#ffb5a6}.good{color:#a8e9bb}audio{width:100%;margin:9px 0}.entry{border-left:3px solid #d78e4b;padding:10px;margin:12px 0;background:#2c252b}.small{font-size:12px}#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#53352d;border:1px solid #e5a85d;padding:12px;border-radius:10px;display:none;max-width:90vw;z-index:5}</style></head><body><div class="wrap"><h1>🏮 いずれてっぺん超えれる？ 🏮</h1><p class="subtitle">🥁 江戸の英語伝言ゲーム 🎆</p><section id="entry" class="card"><h2>🏯 いざ、入室でござる！</h2><label>お名前</label><input id="name" placeholder="例：ゆき"><label>6桁の部屋番号（参加するとき）</label><input id="code" inputmode="numeric" maxlength="6" placeholder="123456"><div class="row"><button id="create">👑 部屋を作る</button><button id="join" class="secondary">🏮 部屋に入る</button></div></section><section id="room" class="hide"><div class="card"><div class="row between"><h2>🏯 部屋 <span id="roomCode"></span></h2><span id="role" class="tag"></span></div><div class="row"><button id="share" class="secondary">🔗 招待リンクをコピー</button><span id="status" class="muted"></span></div></div><section id="lobby" class="card"><h2>👥 参加者と準備</h2><p class="muted">主催者がプレーヤーを選択します。選ばれていない人は観戦者です。</p><div id="people"></div><div id="settings" class="hide"><h2>⚙️ ゲーム設定</h2><label>難易度</label><select id="level"><option value="easy">初級</option><option value="medium">中級</option><option value="hard">上級</option></select><label>モード</label><select id="mode"><option value="casual">ゆったり（制限時間なし）</option><option value="realtime">リアルタイム（1人60秒）</option></select><label>問題数</label><input id="total" type="number" min="1" max="20" value="3"><button id="save">設定を保存</button><button id="start">🥁 全員準備OK！開始</button></div><div id="myPrep" class="hide"><button id="mic">🎤 マイクテスト（録音して確認）</button><span id="micStatus" class="muted"></span><div id="micPreview"></div><button id="ready" disabled>🙋 準備OK！</button></div></section><section id="countdown" class="card hide"><h2>🏮 いざ開幕！</h2><div id="count" class="big">5</div><p class="muted">太鼓が鳴り、提灯に火がともる……</p></section><section id="playing" class="card hide"><h2>📜 英語をつなぐでござる！</h2><div id="turnInfo" class="big"></div><div id="timer" class="muted"></div><div id="myTurn" class="hide"><p id="turnInstruction" class="message"></p><div id="incoming"></div><div class="row"><button id="record">🎤 録音開始</button><button id="stop" class="secondary" disabled>■ 録音停止</button></div><p id="recordStatus" class="muted"></p><div id="recordPreview"></div><button id="submit" disabled>📜 この音声を送る</button></div><p id="wait" class="muted">次の伝言を待つでござる……</p><div id="hostPause" class="hide"><button id="pause">⏸️ 一時停止</button><label>休憩メッセージ</label><textarea id="pauseMessage">少々お待ちくだされ！</textarea><label>再開予定時刻（任意）</label><input id="resumeTime" placeholder="例：18:30"><button id="updatePause" class="secondary">休憩情報を更新</button></div><div id="paused" class="hide message"></div></section><section id="spectator" class="card hide"><h2>👂 観戦席</h2><p class="muted">送信された声を聞けます。英文は答え合わせまで秘密！</p><div id="spectatorFeed"></div></section><section id="results" class="card hide"><h2>🎆 答え合わせでござる！</h2><div id="resultBody"></div><button id="next" class="hide">🏮 次の問題へ</button></section><section id="done" class="card hide"><h2>🎆 お疲れさまでござる！</h2><p>全問題が終了しました。珍回答を振り返ってお楽しみくだされ！</p><div id="history"></div></section><div id="hostClose" class="card hide"><button id="close" class="secondary">部屋を閉じる</button></div></section></div><div id="toast"></div><script>
const $=x=>document.getElementById(x),hide=(x,b)=>$(x).classList.toggle('hide',!b);let ws,me,host=false,room=null,stream,rec,chunks=[],recorded=null,recordTimer=null,listenCount=0,incoming=null,countdownTimer=null,deadlineTimer=null,activePrompt=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const toast=s=>{$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)};const send=m=>ws?.readyState===1&&ws.send(JSON.stringify(m));const mine=()=>room?.people.find(p=>p.id===me);const isMyTurn=()=>room?.phase==='playing'&&room.order[room.turn]===me&&!room.paused;const toAudio=src=>src?`<audio controls src="${src}"></audio>`:'<span class="muted">🔇 音声なし</span>';
function connect(type){if(!$('name').value.trim())return toast('お名前を入力してくだされ！');ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host);ws.onopen=()=>send({type,code:$('code').value,name:$('name').value});ws.onmessage=ev=>{const m=JSON.parse(ev.data);if(m.type==='error')return toast(m.message);if(m.type==='joined'){me=m.id;host=m.host;hide('entry',false);hide('room',true)}if(m.type==='state'){room=m.room;render()}if(m.type==='prompt'){activePrompt=m.text;incoming=null;listenCount=0;renderTurn()}if(m.type==='incoming'){activePrompt=null;incoming=m.audio;listenCount=0;renderTurn()}if(m.type==='countdown')startCount(m.seconds);if(m.type==='turn'){toast(`${m.name}殿の番でござる！`);renderTurn()}if(m.type==='sent')toast(m.timeout?'🥁 時間切れでござる！':`📜 ${m.name}殿の伝言が届いた！`);if(m.type==='spectatorAudio'){$('spectatorFeed').insertAdjacentHTML('afterbegin',`<div class="entry"><b>${esc(m.name)}殿</b>${toAudio(m.audio)}</div>`)}if(m.type==='result')showResult(m);if(m.type==='closed'){toast('部屋が閉じられました');setTimeout(()=>location.reload(),1500)}};ws.onclose=()=>toast('通信が切断されました。ページを更新して再入室してください。')}
$('create').onclick=()=>connect('create');$('join').onclick=()=>connect('join');$('share').onclick=()=>{const link=location.origin+'/?room='+room.code;navigator.clipboard?.writeText(link).then(()=>toast('招待リンクをコピーしました')).catch(()=>prompt('招待リンク',link))};const initialCode=new URLSearchParams(location.search).get('room');if(initialCode)$('code').value=initialCode;
function render(){if(!room)return;$('roomCode').textContent=room.code;host=room.host===me;$('role').textContent=host?'👑 主催者':mine()?.player?'🎤 プレーヤー':'👂 観戦者';$('status').textContent=`${room.people.filter(p=>p.online).length}人 接続中・第${room.round}問 / ${room.total}問`;hide('lobby',room.phase==='lobby');hide('countdown',room.phase==='countdown');hide('playing',room.phase==='playing');hide('results',room.phase==='result');hide('done',room.phase==='done');hide('spectator',!mine()?.player&&room.phase==='playing');hide('settings',host&&room.phase==='lobby');hide('myPrep',mine()?.player&&room.phase==='lobby');hide('hostPause',host&&room.phase==='playing');hide('hostClose',host);$('people').innerHTML=room.people.map(p=>`<div class="player row between"><span>${esc(p.name)} ${p.id===room.host?'👑':''} ${p.player?'🎤':'👂'} ${p.player?(p.mic?'🎙️合格':'🎙️未確認'):''} ${p.ready?'✅':''} ${p.online?'':'⚠️切断'}</span>${host&&room.phase==='lobby'?`<button class="secondary" data-id="${p.id}" data-player="${p.player?'0':'1'}">${p.player?'観戦者にする':'選手に選ぶ'}</button>`:''}</div>`).join('');document.querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>send({type:'select',id:b.dataset.id,player:b.dataset.player==='1'}));$('micStatus').textContent=mine()?.mic?'🎤 マイクテスト合格！':'マイクテストが必要です';$('ready').disabled=!mine()?.mic;$('ready').textContent=mine()?.ready?'準備OKを取り消す':'🙋 準備OK！';$('next').classList.toggle('hide',!host);$('next').textContent=room.round>=room.total?'🎆 ゲームを終了':'🏮 次の問題へ';if(room.phase==='playing')renderTurn();hide('paused',room.paused);$('paused').textContent=room.paused?`🍵 休憩中でござる！\n再開予定：${room.resumeTime||'未設定'}\n${room.pauseMessage}\n主催者の再開をお待ちくだされ！`:'';$('pause').textContent=room.paused?'▶️ 再開':'⏸️ 一時停止';if(room.phase==='done')$('history').innerHTML=room.history.map(h=>`<div class="entry"><b>第${h.round}問</b><p>${esc(h.original)} / ${esc(h.translation)}</p>${h.entries.map(e=>`<p>${esc(e.name)}：${esc(e.transcript)}</p>`).join('')}</div>`).join('')}
$('save').onclick=()=>send({type:'settings',level:$('level').value,mode:$('mode').value,total:$('total').value});$('start').onclick=()=>send({type:'start'});$('ready').onclick=()=>send({type:'ready',ready:!mine()?.ready});$('next').onclick=()=>send({type:'next'});$('pause').onclick=()=>send({type:'pause'});$('updatePause').onclick=()=>send({type:'pauseInfo',message:$('pauseMessage').value,time:$('resumeTime').value});$('close').onclick=()=>{if(confirm('部屋と履歴を削除します。よろしいですか？'))send({type:'close'})};
async function micStream(){return navigator.mediaDevices.getUserMedia({audio:true})}
$('mic').onclick=async()=>{try{const s=await micStream();const recorder=new MediaRecorder(s);const parts=[];recorder.ondataavailable=e=>parts.push(e.data);recorder.onstop=()=>{const blob=new Blob(parts,{type:recorder.mimeType});const url=URL.createObjectURL(blob);$('micPreview').innerHTML=`<p>録音を再生して確認してください</p><audio controls src="${url}"></audio><button id="micPass">音が聞こえた！合格</button>`;$('micPass').onclick=()=>send({type:'mic',ok:true});s.getTracks().forEach(t=>t.stop())};recorder.start();toast('3秒間マイクテスト中！');setTimeout(()=>recorder.state==='recording'&&recorder.stop(),3000)}catch(e){toast('マイクを許可してください（HTTPS または localhost が必要です）')}};
function startCount(sec){clearInterval(countdownTimer);let n=sec;$('count').textContent=n;countdownTimer=setInterval(()=>{if(room?.paused)return;n--;if(n>=0)$('count').textContent=n===0?'🎆 開幕！':n;if(n<=0)clearInterval(countdownTimer)},1000)}
function renderTurn(){if(!room||room.phase!=='playing')return;const p=room.people.find(x=>x.id===room.order[room.turn]);$('turnInfo').textContent=`第${room.round}問：${p?.name||'不明'}殿の番！`;hide('myTurn',isMyTurn());hide('wait',!isMyTurn());if(isMyTurn()){$('turnInstruction').textContent=room.turn===0?'コンピューターの英文を聞いて、声で次の人に伝えてくだされ！':'前の人の声を聞いて、英語で次の人に伝えてくだされ！';$('incoming').innerHTML=room.turn===0?`<button id="hear">🔊 お題を聞く（残り ${3-listenCount}回）</button>`:`${incoming?'<button id="hear">🔊 前の人の声を聞く（残り '+(3-listenCount)+'回）</button>':'<p class="warn">音声が届きませんでした。好きな英語で伝言を続けてくだされ！</p>'}`;const b=$('hear');if(b)b.onclick=()=>{if(listenCount>=3)return;listenCount++;b.textContent=`🔊 聞く（残り ${3-listenCount}回）`;b.disabled=listenCount>=3;if(room.turn===0&&activePrompt){const u=new SpeechSynthesisUtterance(activePrompt);u.lang='en-US';u.rate=room.level==='easy'?.75:room.level==='medium'?.9:1.1;speechSynthesis.speak(u)}else if(incoming){new Audio(incoming).play().catch(()=>toast('再生ボタンを押してください'))}}}clearInterval(deadlineTimer);if(room.mode==='realtime'){let until=Date.now()+60000;deadlineTimer=setInterval(()=>{if(room?.paused)return;const remaining=Math.max(0,Math.ceil((until-Date.now())/1000));$('timer').textContent=`⏱️ 残り約${remaining}秒`;if(remaining<=0)clearInterval(deadlineTimer)},250)}else $('timer').textContent='⏱️ 時間制限なし'}
$('record').onclick=async()=>{try{stream=await micStream();chunks=[];recorded=null;rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=async()=>{const blob=new Blob(chunks,{type:rec.mimeType});const reader=new FileReader();reader.onload=()=>{recorded=reader.result;$('recordPreview').innerHTML=toAudio(recorded);$('submit').disabled=false};reader.readAsDataURL(blob);stream.getTracks().forEach(t=>t.stop());$('record').disabled=false;$('stop').disabled=true;$('recordStatus').textContent='録音完了。聞き直し・録り直しができます。'};rec.start();$('record').disabled=true;$('stop').disabled=false;$('submit').disabled=true;$('recordStatus').textContent='🔴 録音中（最大15秒）';recordTimer=setTimeout(()=>rec?.state==='recording'&&rec.stop(),15000)}catch{toast('マイクへのアクセスを許可してください')}};$('stop').onclick=()=>{clearTimeout(recordTimer);if(rec?.state==='recording')rec.stop()};$('submit').onclick=()=>{if(!recorded)return;if(!confirm('この音声を送信しますか？送信後は取り消せません。'))return;send({type:'submit',audio:recorded});recorded=null;$('submit').disabled=true;$('recordPreview').innerHTML=''};
function showResult(m){$('resultBody').innerHTML=`<div class="message"><b>🎯 最初のお題</b><p>${esc(m.original)}</p><p>${esc(m.translation)}</p></div>${m.entries.map((e,i)=>`<div class="entry"><b>${i+1}. ${esc(e.name)}殿</b><p>${esc(e.transcript)}</p>${toAudio(e.audio)}</div>`).join('')}`;hide('results',true)}
</script></body></html>
